openapi: 3.1.0
info:
  title: Octopus API
  version: 0.1.0
paths:
  /healthz:
    get:
      summary: Server health check
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/auth/config:
    get:
      summary: Read server auth and Sui configuration for ocp login
      responses:
        "200":
          description: Auth configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthConfig"
  /v1/auth/delegate:
    post:
      summary: Register a local-mode delegate key
      responses:
        "201":
          description: Delegate registered
  /v1/repos:
    get:
      summary: List repositories visible to the caller
      responses:
        "200":
          description: Repository list
          content:
            application/json:
              schema:
                type: object
                required:
                  - repos
                properties:
                  repos:
                    type: array
                    items:
                      $ref: "#/components/schemas/RepoListItem"
    post:
      summary: Create a repository
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRepoRequest"
      responses:
        "201":
          description: Repository created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoSummary"
  /v1/repos/{owner}/{repo}/restore:
    post:
      summary: Restore a repository cache from Sui and Walrus
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Repository cache restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreResponse"
  /v1/repos/{owner}/{repo}/manifests:
    get:
      summary: List local artifact manifests for a repository
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Artifact manifests
          content:
            application/json:
              schema:
                type: object
                required:
                  - manifests
                properties:
                  manifests:
                    type: array
                    items:
                      $ref: "#/components/schemas/PackManifest"
  /v1/repos/{owner}/{repo}/index:
    get:
      summary: Read or build the repository index
      parameters:
        - $ref: "#/components/parameters/Owner"
        - $ref: "#/components/parameters/Repo"
      responses:
        "200":
          description: Repository index
    post:
      summary: Force a repository reindex
      parameters:
        - $ref: "#/components/parameters/Owner"
        - $ref: "#/components/parameters/Repo"
      responses:
        "202":
          description: Repository reindexed
  /v1/repos/{owner}/{repo}/commits:
    get:
      summary: List commits for a ref
      parameters:
        - $ref: "#/components/parameters/Owner"
        - $ref: "#/components/parameters/Repo"
      responses:
        "200":
          description: Commit list
  /v1/repos/{owner}/{repo}/tree:
    get:
      summary: List tree entries for a ref and path
      parameters:
        - $ref: "#/components/parameters/Owner"
        - $ref: "#/components/parameters/Repo"
      responses:
        "200":
          description: Tree entries
  /v1/repos/{owner}/{repo}/blob:
    get:
      summary: Read a file blob for a ref and path
      parameters:
        - $ref: "#/components/parameters/Owner"
        - $ref: "#/components/parameters/Repo"
        - name: path
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: File blob
components:
  parameters:
    Owner:
      name: owner
      in: path
      required: true
      schema:
        type: string
    Repo:
      name: repo
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthResponse:
      type: object
      required:
        - ok
        - service
      properties:
        ok:
          type: boolean
        service:
          type: string
    AuthConfig:
      type: object
      required:
        - suiMode
        - suiNetwork
        - suiRpcUrl
      properties:
        suiMode:
          type: string
          enum:
            - local
            - testnet
        suiNetwork:
          type: string
        suiRpcUrl:
          type: string
        packageId:
          type: string
        accountRegistryId:
          type: string
        repoRegistryId:
          type: string
        serverDelegatePublicKey:
          type: string
        serverDelegateAddress:
          type: string
    CreateRepoRequest:
      type: object
      required:
        - owner
        - name
      properties:
        owner:
          type: string
          pattern: "^[A-Za-z0-9._-]+$"
        name:
          type: string
          pattern: "^[A-Za-z0-9._-]+$"
        visibility:
          type: string
          enum:
            - public
            - private
          default: public
    RepoSummary:
      type: object
      required:
        - owner
        - name
        - visibility
        - gitRemotePath
      properties:
        owner:
          type: string
        name:
          type: string
        visibility:
          type: string
          enum:
            - public
            - private
        gitRemotePath:
          type: string
        registryMode:
          type: string
          enum:
            - local
            - testnet
        repoObjectId:
          type: string
          description: Local registry mode uses local:{sha256-prefix}; live Sui will use an object ID.
    RepoListItem:
      allOf:
        - $ref: "#/components/schemas/RepoSummary"
        - type: object
          properties:
            repoId:
              type: string
            defaultBranchCommit:
              type:
                - string
                - "null"
            refCount:
              type: integer
            manifestCount:
              type: integer
            updatedAtMs:
              type: integer
    PackManifest:
      type: object
      required:
        - manifestId
        - repoId
        - owner
        - repo
        - refName
        - newCommit
        - walrusBlobId
        - artifactDigest
        - artifactSizeBytes
        - artifactPath
        - isSnapshot
        - createdAtMs
        - seq
      properties:
        manifestId:
          type: string
        repoId:
          type: string
        owner:
          type: string
        repo:
          type: string
        refName:
          type: string
        oldCommit:
          type:
            - string
            - "null"
        newCommit:
          type: string
        walrusBlobId:
          type: string
          description: Local fallback uses local:{sha256}; real Walrus will use a Walrus blob ID.
        walrusBlobObjectId:
          type: string
        artifactDigest:
          type: string
          pattern: "^[a-f0-9]{64}$"
        artifactSizeBytes:
          type: integer
          minimum: 0
        artifactPath:
          type: string
        storageMode:
          type: string
          enum:
            - local
            - walrus-cli
            - walrus-relay
        isSnapshot:
          type: boolean
        createdAtMs:
          type: integer
        seq:
          type: integer
    RestoreResponse:
      type: object
      required:
        - owner
        - repo
        - repoPath
        - manifestId
        - refName
        - restoredCommit
        - artifactDigest
        - artifactPath
        - storageMode
        - manifestSource
      properties:
        owner:
          type: string
        repo:
          type: string
        repoPath:
          type: string
        manifestId:
          type: string
        refName:
          type: string
        restoredCommit:
          type: string
        artifactDigest:
          type: string
        artifactPath:
          type: string
        storageMode:
          type: string
          enum:
            - local
            - walrus-cli
            - walrus-relay
        manifestSource:
          type: string
          enum:
            - sui-local
            - sui-testnet
            - artifact-fallback
